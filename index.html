<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock, paper, scissors shot!</title>
    <script src="javascript.js" defer></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="container center">

        <h1 class="smallPadding"> Rock Paper Scissors</h1>

        <h3 class="">first hits 5 points wins a 🍪!</h3>

        <div class="displayScore largePadding"></div>

        <div class="buttons">
            <button class="playerButton rock" value="rock">Rock</button>
            <button class="playerButton paper" value="paper">Paper</button>
            <button class="playerButton scissors" value="scissors">Scissors</button>
        </div>

        <div class="parent largePadding"></div>

    </div>

</body>
</html>
